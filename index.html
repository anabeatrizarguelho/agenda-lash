<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Lash</title>

    <script src="https://kit.fontawesome.com/b0d4af56fd.js" crossorigin="anonymous"></script>

    <link rel="shortcut icon" href="img/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/style.css">

</head>
<body>
    <main>
        <h4>Agenda Lash</h4>
        <h1>Seu organizador de atendimentos</h1>
        <p>Controle o retorno de suas clientes sem depender da memória</p>

        <a href="login.html">Entrar</a>
    </main>

    <section>
        <div>
            <i class="fa-regular fa-calendar-days"></i>
            <h5>Cadastro rápido</h5>
            <p>Nome, WhatsApp e data em segundos</p>
        </div>

        <div>
            <i class="fa-regular fa-bell"></i>
            <h5>Alertas automáticos</h5>
            <p>Saiba quem retorna hoje</p>
        </div>
        <div>
            <i class="fa-solid fa-triangle-exclamation"></i>
            <h5>Prazo vencido</h5>
            <p>Identifique quem precisa refazer</p>
        </div>
    </section>
