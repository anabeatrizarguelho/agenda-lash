<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Agenda Lash</title>

    <script src="https://kit.fontawesome.com/b0d4af56fd.js" crossorigin="anonymous"></script>

    <link rel="shortcut icon" href="img/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <main>
        <section class="text">
            <h4>Organize o retorno das suas clientes sem esforço</h4>
            <p>Controle os prazos de 15 dias em um só lugar</p>
        </section>

        <section class="form">
            <div>
                <p class="mark">Agenda de cílios</p>
                <h5>Entrar</h5>
                <p class="subtext">Acesse sua agenda de clientes</p>

                <label for="email">Email</label>
                <input type="email" name="email" id="email" required>

                <label for="senha">Senha</label>
                <div class="password-wrapper">
                    <input type="password" name="password" id="showPassword" minlength="8" maxlength="10" required>
                    <i class="fa-regular fa-eye" id="icone-olho"></i>
                </div>
                
                <p class="reset-password">Esqueci minha senha</p>

                <button class="submit-btn" type="submit">Entrar</button>
                <button class="google-login-btn" type="button"><i class="fa-brands fa-google"></i>Entrar com a conta Google</button>

                <p class="register">Não tem conta? <a href="register.html">Cadastre-se</a></p>
            </div>
        </section>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
