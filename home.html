<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Lash</title>

    <script src="https://kit.fontawesome.com/b0d4af56fd.js" crossorigin="anonymous"></script>

    <link rel="shortcut icon" href="img/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/home.css">
</head>
<body>
    <header>
        <p>Olá, <span>Nome Completo do usuário</span></p>
        <i class="fa-regular fa-bell"></i>
        <i class="fa-regular fa-user"></i>
    </header>
    <main>
        <section class="header-main">
            <h4>Agenda de cílios</h4>
            <button>+ Nova cliente</button>
        </section>

        <section class="cards-area">
            <div class="cards-contadores">
                <p>Em dia</p>
                <h5>8</h5>
            </div>

            <div class="cards-contadores">
                <p>Manutenção</p>
                <h5>2</h5>
            </div>

            <div class="cards-contadores">
                <p>Atrasadas</p>
                <h5>5</h5>
            </div>
        </section>

        <section class="cards-clientes-area">
                <div class="card-cliente">
                    <div class="card-cliente-header">
                        <h6 class="nome-cliente">Camila Souza</h6>
                        <h6 class="numero-cliente">(21) 98031-9658</h6>
                    <div>
                    <div class="card-cliente-detail">
                        <p>Última manutenção: </p>
                        <p class="data-registrada">25/06</p>
                        <p class="data-retorno">14/10</p>
                    </div>
                    <div class="card-cliente-status">
                        <p class="status-cliente">Semana de manutenção</p>
                        <i class="fa-brands fa-whatsapp"></i>
                    </div>
                    
                </div>

                <!-- <div class="">
                    <p class="nome-cliente">Renata Soares</p>
            
                    <p class="numero-cliente">(21) 98031-9658</p>
                    <p class="status-cliente">Atrasada</p>
                    <i class="fa-brands fa-whatsapp"></i>
                </div>

                <div class="">

                    <p class="numero-cliente">(21) 98031-9658</p>
                    <p class="status-cliente">Em dia</p>
                </div> -->
        </section>
    </main>
</body>
</html>
