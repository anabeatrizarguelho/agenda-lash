<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Lash</title>

    <script src="https://kit.fontawesome.com/b0d4af56fd.js" crossorigin="anonymous"></script>

    <link rel="shortcut icon" href="img/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/home.css">
</head>
<body>
    <header>
        <p>Olá, <span id="nomeUsuario">Nome Completo do usuário</span></p>
        <i class="fa-solid fa-power-off" id="logout"></i>
    </header>
    <main>
        <section class="header-main">
            <h4>Agenda de cílios</h4>
            <button id="abrirModal"><span>Adicionar</span></button>
        </section>

        <section class="cards-area">
            <div class="cards-contadores">
                <p>Em dia</p>
                <h5 id="emDia">0</h5>
            </div>

            <div class="cards-contadores">
                <p>Manutenção</p>
                <h5 id="manutencao">0</h5>
            </div>

            <div class="cards-contadores">
                <p>Atrasadas</p>
                <h5 id="atrasadas">0</h5>
            </div>
        </section>

        <!-- class="list" -->
        <section id="clientes-section" class="clientes-section">
            

        </section>
    </main>
    <!-- modal add nova cliente -->
     <dialog id="meuModal">
        <!-- <div class="dialog"> -->
        <form id="formAddCliente" action="" method="dialog">
            <h5>Nova cliente</h5>
            <p class="subtext">Preencha os dados para começar o acompanhamento</p>

            <label for="nome">Nome</label>
            <input type="text" name="nome" id="nome" required>

            <label for="whatsapp">WhatsApp</label>
            <input type="tel" name="whatsapp" id="whatsapp" placeholder="(00) 00000-0000" minlength="11" maxlength="11" required>

            <label for="dataAtendimento">Data de atendimento</label>
            <input type="date" name="dataAtendimento" id="dataAtendimento" required>
            
            <!-- <div class="previsao-retorno">
                <i class="fa-solid fa-circle-exclamation"></i>
                <span id="dataRetorno">Data de retorno</span>
            </div> -->

            <button id="salvarCliente" class="submit-btn" type="submit">Salvar cliente</button>
            <button class="cancel-btn" type="button" formmethod="dialog">Cancelar</button>
        </form>
        <!-- </div> -->
     </dialog>

     <script src="js/script.js"></script>
     <script type="module" src="js/pages/home.js"></script>

</body>
</html>
